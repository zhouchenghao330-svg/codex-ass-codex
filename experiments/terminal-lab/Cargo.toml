[package]
name = "codex-room-terminal-lab"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "codex-room-terminal-lab"

[[bin]]
name = "codex-room-reading-demo"
path = "src/reading_demo.rs"

[dependencies]
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-markdown = "=0.3.10"
pulldown-cmark = "=0.13.5"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
debug = 1
