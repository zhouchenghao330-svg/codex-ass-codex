[project]
name = "codex-room"
version = "0.2.3"
description = "One terminal for several independent Codex sessions."
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8,<9"]

[project.scripts]
codex-room = "codex_room.launcher:main"
codex_room = "codex_room.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codex_room"]

[tool.hatch.build.targets.wheel.force-include]
"terminal-ui/Cargo.toml" = "codex_room/rust_ui/Cargo.toml"
"terminal-ui/Cargo.lock" = "codex_room/rust_ui/Cargo.lock"
"terminal-ui/src" = "codex_room/rust_ui/src"
